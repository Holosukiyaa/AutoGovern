<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AG · 长期目标</title>
<style>
:root{color-scheme:light;--ink:#173229;--muted:#62756d;--line:#dbe3dd;--green:#1b6850;--paper:#f3f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft Yahei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:7px 13px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:white}button:disabled{opacity:.5;cursor:wait}header{padding:26px 32px 20px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.15em}h1{font-size:27px;line-height:1.3;margin:8px 0}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}.meta,.muted,small{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}main{padding:20px 32px 40px;max-width:1900px;margin:auto}.constraints{border:1px solid #bbd3bf;background:#e9f1e5;padding:14px 18px;margin-bottom:20px;border-radius:9px;position:sticky;top:0;z-index:2;max-height:28vh;overflow:auto}.constraints p{margin:3px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column{background:#fff;border:1px solid var(--line);padding:18px;border-radius:10px;min-width:0}.row{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.row:first-of-type{border-top:0}.text{white-space:pre-wrap}.badge{display:inline-block;border-radius:4px;background:#eef1eb;padding:1px 7px;margin:3px 5px 3px 0;font-size:12px}.badge.warn{background:#fff0d1;color:#795b0a}.badge.ok{background:#d9eddd;color:#215c38}details{margin:6px 0}summary{cursor:pointer;color:var(--green);font-size:13px}dl{margin:6px 0;display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr);gap:3px 10px;font-size:13px}dt{color:var(--muted)}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.editor{margin-top:12px;padding:12px;background:#f6f8f3;border-radius:7px}label{display:block;font-size:13px;color:var(--muted);margin-top:8px}input,select,textarea{display:block;width:100%;padding:8px;border:1px solid #cbd7cf;border-radius:5px;color:var(--ink);background:#fff}textarea{min-height:90px;resize:vertical}.editor button{margin-top:10px}.notice{padding:12px 15px;border-radius:7px;margin:12px 0;white-space:pre-wrap}.error{background:#fff0e5;color:#843e17;border:1px solid #e5b490}.success{background:#e3efe5}.hidden{display:none!important}#conflict{border:2px solid #cb8d40;background:#fff8ea;padding:18px;border-radius:9px;margin-bottom:20px}#conflict-content{max-height:400px;overflow:auto}#global-diff{background:#fff;padding:15px;border-radius:8px;margin:15px 0}footer{color:var(--muted);font-size:12px;margin-top:20px}@media(min-width:1650px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main,header{padding:18px}}@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:23px}.constraints{position:static;max-height:none}}
</style></head><body>
<header><div class="brand">AG / LONG TASK</div><h1 id="title">正在读取长期目标…</h1><div id="identity" class="meta"></div><div class="toolbar"><button id="refresh" class="primary">刷新最新事实</button><label style="margin:0">与修订号比较 <input id="diff-revision" type="number" min="0" value="0" style="display:inline;width:78px;padding:5px"></label><button id="show-diff">查看版本差异</button><span id="connection" class="muted" role="status"></span></div></header>
<main><div id="message" role="status" class="notice hidden"></div><section id="conflict" class="hidden" role="alert"><h2>修改未保存：所见版本已过期</h2><p>已有其他入口更新了事实。你的输入保留在原表单中；请先查看差异，再刷新并重新决定修改。</p><div id="conflict-content"></div><button id="conflict-reload">读取最新版本</button></section><section class="constraints" aria-label="当前行动约束"><h2>当前行动始终适用的约束</h2><div id="pinned-constraints"></div><small>事实更新不授予施工权限。重大变更先进入待决，最终审校与人工 confirm-map 沿现有 AG 入口执行。</small></section><div id="global-diff" class="hidden"></div><div class="grid"><section class="column" id="goal-column"><h2>01 目标与来源</h2><div id="goal-body"></div></section><section class="column" id="results-column"><h2>02 结果与进度</h2><div id="results-body"></div></section><section class="column" id="constraints-column"><h2>03 有效约束</h2><div id="constraints-body"></div></section><section class="column" id="plans-column"><h2>04 计划与依赖</h2><div id="plans-body"></div></section><section class="column" id="evidence-column"><h2>05 证据与待验</h2><div id="evidence-body"></div></section><section class="column" id="decisions-column"><h2>06 待决与下一步</h2><div id="decisions-body"></div></section></div><footer>本页由 AG 结构化记录实时生成。逐项来源与历史保留原文；导出和展示不是另一份权威。</footer></main>
<script>
'use strict';
let record=null, token='', history=[];
const $=id=>document.getElementById(id);
const labels={goal_id:'目标身份',revision:'事实修订',intent_revision:'意图版本',authorized_intent_revision:'已授权意图版本',source:'来源',kind:'来源类型',ref:'来源引用',text:'原文',original:'用户原话',state:'事实状态',status:'状态',id:'条目身份',result_ids:'相关结果',result_id:'结果',depends_on:'依赖结果',scope:'适用范围',created_at:'建立时间',updated_at:'更新时间',operation:'增量操作',type:'操作类型',changes:'修改',field:'字段',value:'新值',before:'变更前',after:'变更后',diff:'差异',current_revision:'当前修订',expected_revision:'所见修订',candidate:'候选',candidate_id:'候选身份',report:'报告',report_id:'报告身份',task_id:'任务身份',fingerprint:'工作包指纹',input_fingerprint:'输入指纹',reason:'原因',stale_reason:'待验原因',verified:'验证结果',verification:'验证状态',verification_state:'验证状态',return_to:'返回点',title:'标题',target:'变更对象',proposal_id:'提案身份'};
const states={unknown:'自述 / 未知 · 尚未验证',verified:'已验证 · 当前有效',unverified:'未验',blocked:'依赖阻塞',self_claimed:'自述 · 尚未验证',selfclaimed:'自述 · 尚未验证',stale:'待复验 · 旧证据',pending:'待决',proposed:'待决提案',available:'可用能力',investigating:'调查中',ready:'依赖就绪',done:'计划已做 · 不代表结果验证',active:'进行中',open:'未完成',accepted:'已接纳',rejected:'已拒绝',draft:'草案'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
function display(v){if(v===null)return '未记录';if(typeof v==='boolean')return v?'是':'否';return String(v)}
function structured(value){if(value===null||typeof value!=='object')return el('span',display(value));if(Array.isArray(value)){const box=el('div');if(!value.length)box.append(el('span','无','muted'));value.forEach(v=>{const row=el('div',undefined,'row');row.append(structured(v));box.append(row)});return box}const dl=el('dl');Object.entries(value).forEach(([k,v])=>{dl.append(el('dt',labels[k]||k));const dd=el('dd');dd.append(structured(v));dl.append(dd)});return dl}
function details(title,value){const d=el('details');d.append(el('summary',title),structured(value));return d}
function badge(state){return el('span',states[state]||state||'未验','badge '+(state==='verified'?'ok':['unverified','stale','blocked','self_claimed','selfclaimed'].includes(state)?'warn':''))}
function notice(text,error=false){$('message').textContent=text;$('message').className='notice '+(error?'error':'success')}
async function request(url,opts){const r=await fetch(url,opts);let data;try{data=await r.json()}catch{throw new Error('服务返回内容无法读取。')}if(!r.ok){const e=new Error(data.error||'操作失败');e.status=r.status;e.details=data.details;throw e}return data}
function provenance(row,collection){const box=el('div');box.append(details('展开来源与修订', {id:row.id,revision:row.revision,source:row.source||record.source}));const relevant=history.filter(h=>{const o=h.operation||h.op||{};return (row.id&&(o.id===row.id||o.result_id===row.id||JSON.stringify(o.changes||[]).includes(row.id)))||(!row.id&&collection==='goal')});box.append(details('展开逐项版本变更',relevant.length?relevant:'此条目暂无后续变更；来源见上。'));return box}
function rowCard(row,collection){const n=el('article',undefined,'row');n.dataset.itemId=row.id||'';n.append(el('div',row.text||row.title||row.reason||(collection==='evidence'?'检查报告 '+row.report_id+' · 候选 '+row.candidate:row.id)||'记录','text'));if(collection==='evidence'){n.append(badge(row.valid?(row.coverage?.length?'verified':'unverified'):'stale'));if(row.invalidation_reasons?.length)n.append(el('div','待复验原因：'+row.invalidation_reasons.join('；'),'muted'))}else if(row.status||row.state)n.append(collection==='constraint'&&row.state==='active'?el('span','当前生效','badge'):badge(row.status||row.state));if(row.scope)n.append(el('div','适用：'+row.scope.join('、'),'muted'));if(row.result_ids?.length)n.append(el('div','相关结果：'+row.result_ids.join('、'),'muted'));if(row.depends_on)n.append(el('div','依赖结果：'+row.depends_on,'muted'));n.append(provenance(row,collection));const extra=Object.fromEntries(Object.entries(row).filter(([k])=>!['text','title','source','revision','id','status','state'].includes(k)));if(Object.keys(extra).length)n.append(details('展开条目细节',extra));return n}
function formField(form,label,name,value='',type='text'){const l=el('label',label);let input;if(type==='textarea')input=el('textarea');else{input=el('input');input.type=type}input.name=name;input.value=value;l.append(input);form.append(l);return input}
function editForm(row,type){const d=el('details');d.append(el('summary','编辑这条普通事实'));const form=el('form',undefined,'editor');form.dataset.editId=row.id;formField(form,'内容','text',row.text||'','textarea');const state=formField(form,'状态（事实描述，不代替验证）','state',row.state||'');const submit=el('button','保存增量修改','primary');submit.type='submit';form.append(submit);const seen=record.revision;form.onsubmit=async e=>{e.preventDefault();const changes={text:form.elements.text.value};if(state.value)changes.state=state.value;await save({type:'update_'+type,id:row.id,changes},seen,submit)};d.append(form);return d}
function addForm(container,type,title){const d=el('details');d.append(el('summary',title));const form=el('form',undefined,'editor');form.dataset.addType=type;const content=formField(form,'内容','text','','textarea');content.required=true;formField(form,'相关结果 ID（可选，逗号分隔）','result_ids');const submit=el('button','添加记录','primary');submit.type='submit';form.append(submit);const seen=record.revision;form.onsubmit=async e=>{e.preventDefault();const op={type:'add_'+type,text:content.value};const ids=form.elements.result_ids.value.split(',').map(s=>s.trim()).filter(Boolean);if(ids.length)op.result_ids=ids;await save(op,seen,submit)};d.append(form);container.append(d)}
function list(target,rows,kind){const box=$(target);if(!rows.length)box.append(el('p','尚无记录，未知不计作完成。','muted'));rows.forEach(r=>{const card=rowCard(r,kind);if(['fact','plan','investigation','capability'].includes(kind))card.append(editForm(r,kind));box.append(card)})}
function proposalForm(target){const d=el('details');d.append(el('summary','准备目标 / 结果 / 约束变更'));const f=el('form',undefined,'editor');f.dataset.proposal='true';const l=el('label','变更对象');const select=el('select');select.name='target';[['goal','目标'],['result','结果承诺'],['constraint','约束']].forEach(([v,t])=>{const o=el('option',t);o.value=v;select.append(o)});l.append(select);f.append(l);const itemLabel=el('label','选择条目');const item=el('select');item.name='id';itemLabel.append(item);f.append(itemLabel);const fieldLabel=el('label','调整内容');const field=el('select');field.name='field';fieldLabel.append(field);f.append(fieldLabel);function choices(){item.replaceChildren();const rows=select.value==='result'?record.results:select.value==='constraint'?record.constraints:[];if(select.value==='goal'){const o=el('option','当前目标');o.value='';item.append(o)}else(rows||[]).forEach(r=>{const o=el('option',r.text+' ('+r.id+')');o.value=r.id;item.append(o)});field.replaceChildren();const fields=select.value==='goal'?[['title','目标标题']]:[['text',select.value==='result'?'结果承诺':'约束原文']];fields.forEach(([v,t])=>{const o=el('option',t);o.value=v;field.append(o)})}select.onchange=choices;choices();const value=formField(f,'建议新内容','value','','textarea');value.required=true;const reason=formField(f,'变更原因','reason','','textarea');reason.required=true;const btn=el('button','提交待决提案','primary');btn.type='submit';f.append(btn,el('p','此操作只记录提案。请沿现有 AG 审校和人工 confirm-map 处理授权。','muted'));const seen=record.revision;f.onsubmit=async e=>{e.preventDefault();const change={target:select.value,field:field.value,value:value.value};if(item.value)change.id=item.value;await save({type:'propose_change',changes:[change],reason:reason.value},seen,btn)};d.append(f);target.append(d)}
function dependencyForm(target){const d=el('details');d.append(el('summary','添加结果依赖'));const f=el('form',undefined,'editor');f.dataset.dependency='true';function resultChoice(label,name){const l=el('label',label),select=el('select');select.name=name;(record.results||[]).forEach(r=>{const o=el('option',r.text+' ('+r.id+')');o.value=r.id;select.append(o)});l.append(select);f.append(l);return select}const from=resultChoice('被阻塞的结果','result_id');const to=resultChoice('先要完成的结果','depends_on');formField(f,'依赖原因','reason','','textarea');const b=el('button','添加依赖','primary');b.type='submit';f.append(b);const seen=record.revision;f.onsubmit=async e=>{e.preventDefault();await save({type:'add_dependency',result_id:from.value,depends_on:to.value,state:'blocked',reason:f.elements.reason.value,return_to:{goal_id:record.goal_id,result_id:from.value}},seen,b)};d.append(f);target.append(d)}
function render(){document.title='AG · '+record.title;$('title').textContent=record.title;$('identity').textContent=record.goal_id+' · 事实修订 r'+record.revision+' · 意图 v'+record.intent_revision+' · 已授权意图 '+(record.authorized_intent_revision??'无');['goal','results','constraints','plans','evidence','decisions'].forEach(x=>$(x+'-body').replaceChildren());const pin=$('pinned-constraints');pin.replaceChildren();const constraints=(record.constraints||[]).filter(c=>!['deleted','removed','superseded','inactive','retired'].includes(c.state||c.status));if(!constraints.length)pin.append(el('p','当前未记录约束；这不代表已授予施工权限。'));constraints.forEach(c=>pin.append(el('p',(c.id?c.id+' · ':'')+c.text+'（适用 '+(c.scope||['*']).join('、')+'）')));const g=$('goal-body');g.append(el('div',record.original,'text'),provenance(record,'goal'));g.append(el('h3','能力与普通事实'));list('goal-body',record.facts||[],'fact');list('goal-body',record.capabilities||[],'capability');addForm(g,'fact','添加普通事实');addForm(g,'capability','记录当前能力');const results=record.results||[];const verified=results.filter(r=>r.status==='verified').length;$('results-body').append(el('p',verified+' / '+results.length+' 项结果有当前有效验据。计划完成不计入已验证结果。','muted'));list('results-body',results,'result');list('constraints-body',constraints,'constraint');$('plans-body').append(el('h3','执行计划'));list('plans-body',record.plans||[],'plan');addForm($('plans-body'),'plan','添加计划步骤');$('plans-body').append(el('h3','依赖链'));list('plans-body',record.dependencies||[],'dependency');dependencyForm($('plans-body'));$('plans-body').append(el('h3','调查'));list('plans-body',record.investigations||[],'investigation');addForm($('plans-body'),'investigation','记录调查');list('evidence-body',record.evidence||[],'evidence');$('evidence-body').append(el('p','自述、未验和过期证据均不代表结果完成；验证由真实 AG 检查与交付记录支持。','muted'));list('decisions-body',record.decisions||[],'decision');if(record.remaining?.length){$('decisions-body').append(el('h3','尚未完成的结果'));record.remaining.forEach(r=>{const p=el('div',r.text,'row');p.append(badge(r.status));$('decisions-body').append(p)})}const next=record.return_to||record.next_action;if(next)$('decisions-body').append(details('返回点与下一步',next));proposalForm($('decisions-body'));$('connection').textContent='当前显示 r'+record.revision+' · 点击刷新读取最新持久记录'}
async function load(){try{const [r,h]=await Promise.all([request('/api/goal'),request('/api/history')]);record=r;history=h;render();$('conflict').classList.add('hidden')}catch(e){notice(e.message,true)}}
async function save(operation,seen,button){button.disabled=true;try{await request('/api/operations',{method:'POST',headers:{'Content-Type':'application/json','Origin':location.origin,'X-AG-Panel-Token':token},body:JSON.stringify({expected_revision:seen,operation})});await load();notice('已保存增量修改，当前事实修订 r'+record.revision+'。')}catch(e){if(e.status===409){$('conflict').classList.remove('hidden');$('conflict-content').replaceChildren(structured(e.details||e.message));$('conflict').scrollIntoView({block:'start',behavior:'smooth'})}else notice(e.message,true)}finally{button.disabled=false}}
$('refresh').onclick=load;$('conflict-reload').onclick=load;$('show-diff').onclick=async()=>{try{const d=await request('/api/diff?since_revision='+encodeURIComponent($('diff-revision').value));$('global-diff').replaceChildren(el('h2','版本差异'),structured(d));$('global-diff').classList.remove('hidden')}catch(e){notice(e.message,true)}};
(async()=>{try{token=(await request('/api/session')).token;await load()}catch(e){notice(e.message,true)}})();
</script></body></html>
