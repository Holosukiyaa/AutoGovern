[project]
name = "ag"
version = "0.3.0"
description = "MCP delivery loop: worktree, enrolled tests, git hook, ff-only."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ag = "ag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ag = ["strategies.sqlite", "critic_prompt.md", "switch_prompt.md", "ticket_prompt.md"]

[tool.setuptools.data-files]
"share/ag/skills/ag-anchor" = ["skills/ag-anchor/SKILL.md", "skills/ag-anchor/brief.json"]
"share/ag/skills/ag-guide" = ["skills/ag-guide/SKILL.md"]
"share/ag/skills/ag-config" = ["skills/ag-config/SKILL.md"]
"share/ag/skills/ag-troubleshooting" = ["skills/ag-troubleshooting/SKILL.md"]
