[project]
name = "ag"
version = "0.2.4"
description = "MCP delivery loop: worktree, enrolled tests, git hook, ff-only."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ag = "ag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ag = ["strategies.sqlite", "critic_prompt.md"]

[tool.setuptools.data-files]
"share/ag/skills/ag-anchor" = ["skills/ag-anchor/SKILL.md"]
