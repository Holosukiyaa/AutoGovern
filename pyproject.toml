[project]
name = "ag"
version = "0.1.0"
description = "MCP delivery loop: worktree, enrolled tests, git hook, ff-only."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ag = "ag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ag = ["strategies.sqlite"]
