[project]
name = "ag"
version = "0.1.0"
description = "Physical probe queue over MCP. AI output is untrusted until a self-check runs."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ag = "ag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
