<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <style>
      .bg { fill: #0e1218; }
      .panel { fill: #141b24; stroke: #252f3c; }
      .chart { fill: #0e1218; }
      .axis { stroke: #2a3442; stroke-width: 2; }
      .diagonal { stroke: #3a4656; stroke-dasharray: 6 6; }
      .label { fill: #8b97a8; font: 11px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .title { fill: #e8eef6; font: 600 18px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .card-title { fill: #e8eef6; font: 600 15px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .desc { fill: #8b97a8; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .green { fill: #3dbe8c; }
      .yellow { fill: #e0b34a; }
      .blue { fill: #6ea8ff; }
      .num { fill: #0e1218; font: 700 9px "Segoe UI", sans-serif; text-anchor: middle; }
      .point-title { fill: #e8eef6; font: 600 10px "Microsoft YaHei", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1050"/>
  <text class="title" x="50" y="48">ag 策略图 · 四维坐标</text>
  <text class="desc" x="50" y="76">横轴真实帮助，纵轴副作用，虚线右下 = 正面大于负面。点的位置是判断，不是 usage 算分。</text>
  <text class="desc" x="50" y="96">绿=该类该用　黄=建议/体检　蓝=看见，不当门。意图锚点：固定注意力，而不是固定步骤。</text>

  <g transform="translate(50,130)">
    <rect class="panel" width="640" height="430"/>
    <text class="card-title" x="24" y="34">交货 ship · 防事故</text>
    <text class="desc" x="24" y="56">主仓不是工地。流程完成 ≠ 产品过关。只有这些能签发 product、拒绝 finish。</text>
