<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill: #0e1218; }
      .panel { fill: #141b24; stroke: #252f3c; stroke-width: 2; }
      .main-route { fill: none; stroke: #4d9dd8; stroke-width: 7; stroke-linecap: round; opacity: .88; }
      .hard-route { fill: none; stroke: #e0b34a; stroke-width: 7; stroke-linecap: round; opacity: .88; }
      .note-line { fill: none; stroke: #8b97a8; stroke-width: 2; stroke-dasharray: 8 7; }
      .start { fill: #182432; stroke: #6ea8ff; stroke-width: 2; }
      .anchor { fill: #182432; stroke: #4d9dd8; stroke-width: 2; }
      .hard { fill: #211d14; stroke: #e0b34a; stroke-width: 3; }
      .terminal { fill: #173528; stroke: #3dbe8c; stroke-width: 3; }
      .note { fill: #171b22; stroke: #384350; stroke-width: 2; stroke-dasharray: 9 7; }
      .title { fill: #e8eef6; font: 700 26px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .subtitle { fill: #98a6b8; font: 15px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .tag { fill: #6fb7ef; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .hard-tag { fill: #e0b34a; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .terminal-tag { fill: #54d19b; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .card-title { fill: #ffffff; font: 700 15px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .text { fill: #d7e2ee; font: 13px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .small { fill: #98a6b8; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .note-tag { fill: #a8b4c4; font: 700 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .note-title { fill: #d7e2ee; font: 700 13px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .legend { fill: #7d8b9c; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d9dd8" />
    </marker>
    <marker id="hard-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0b34a" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720" rx="22" />
  <rect class="panel" x="32" y="26" width="1216" height="556" rx="22" />
  <text class="title" x="62" y="72">意图锚点图 · 让 AI 看见同一条路线</text>
  <text class="subtitle" x="62" y="100">主线只说你想要什么、你会看到什么；技术细节放到下面的实现注记。</text>

  <path class="main-route" d="M210 224 L250 224" />
  <path class="main-route" d="M410 224 L450 224" />
  <path class="hard-route" d="M610 224 L650 224" marker-end="url(#hard-arrow)" />
  <path class="main-route" d="M810 224 L850 224" />
  <path class="main-route" d="M1010 224 L1050 224" marker-end="url(#arrow)" />

  <g>
    <rect class="start" x="50" y="174" width="160" height="106" rx="18" />
    <text class="tag" x="70" y="201">START</text>
    <text class="card-title" x="70" y="226">你的目标</text>
    <text class="small" x="70" y="249">这轮优化</text>
    <text class="small" x="70" y="268">锚点图表达</text>
  </g>

  <g>
    <rect class="anchor" x="250" y="160" width="160" height="134" rx="18" />
    <text class="tag" x="270" y="187">a1 · 你想要</text>
    <text class="card-title" x="270" y="212">先对齐</text>
    <text class="text" x="270" y="236">AI 先说清最终结果</text>
    <text class="small" x="270" y="256">和检查点</text>
    <text class="small" x="270" y="277">你看不懂就没对齐</text>
  </g>

  <g>
    <rect class="anchor" x="450" y="160" width="160" height="134" rx="18" />
    <text class="tag" x="470" y="187">a2 · 你会看到</text>
    <text class="card-title" x="470" y="212">看得懂的图</text>
    <text class="text" x="470" y="236">主线说人话</text>
    <text class="small" x="470" y="256">你能判断路线</text>
    <text class="small" x="470" y="277">对不对</text>
  </g>

  <g>
    <rect class="hard" x="650" y="160" width="160" height="134" rx="18" />
    <text class="hard-tag" x="670" y="187">a3 · 必须做到</text>
    <text class="card-title" x="670" y="212">技术不进主线</text>
    <text class="text" x="670" y="236">路径、代号、机制</text>
    <text class="small" x="670" y="256">都放实现注记</text>
    <text class="small" x="670" y="277">看不懂就必须重画</text>
  </g>

  <g>
    <rect class="anchor" x="850" y="160" width="160" height="134" rx="18" />
    <text class="tag" x="870" y="187">a4 · 结束前</text>
    <text class="card-title" x="870" y="212">回到这条路线</text>
    <text class="text" x="870" y="236">交差前列出锚点</text>
    <text class="small" x="870" y="256">不替你宣布完成</text>
    <text class="small" x="870" y="277">偏离要明说</text>
  </g>

  <g>
    <rect class="terminal" x="1050" y="174" width="160" height="106" rx="18" />
    <text class="terminal-tag" x="1070" y="201">END</text>
    <text class="card-title" x="1070" y="226">你能验收</text>
    <text class="small" x="1070" y="249">一眼看出</text>
    <text class="small" x="1070" y="268">最后路线</text>
  </g>

  <path class="note-line" d="M640 300 C640 340 640 350 640 374" marker-end="url(#arrow)" />
  <g>
    <rect class="note" x="82" y="374" width="1116" height="160" rx="20" />
    <text class="note-tag" x="110" y="406">实现注记 · 给 AI / 维护者看，不给用户判断路线用</text>

    <g>
      <text class="note-title" x="110" y="438">记忆</text>
      <text class="small" x="110" y="462">anchors 保存在任务状态</text>
      <text class="small" x="110" y="483">SVG 放 .ag-artifacts/anchor-maps/</text>
    </g>
    <g>
      <text class="note-title" x="430" y="438">权限</text>
      <text class="small" x="430" y="462">soft 是注意力，不自动验收</text>
      <text class="small" x="430" y="483">hard 只能来自用户或项目规则</text>
    </g>
    <g>
      <text class="note-title" x="750" y="438">收尾</text>
      <text class="small" x="750" y="462">finish 回显全部锚点</text>
      <text class="small" x="750" y="483">不替用户宣布 soft anchor 已完成</text>
    </g>
  </g>

  <text class="legend" x="62" y="632">图例：蓝 = 意图方向　黄 = 必须做到　绿 = 你能验收　灰虚线 = 实现注记</text>
  <text class="legend" x="62" y="658">写法：你想要 → 你会看到 → 必须做到 → 结束前 → 你能验收</text>
</svg>
