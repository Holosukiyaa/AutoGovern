<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #0e1218; }
      .panel { fill: #141b24; stroke: #252f3c; stroke-width: 2; }
      .main-route { fill: none; stroke: #4d9dd8; stroke-width: 7; stroke-linecap: round; opacity: .88; }
      .hard-route { fill: none; stroke: #e0b34a; stroke-width: 7; stroke-linecap: round; opacity: .88; }
      .unknown-route { fill: none; stroke: #8b97a8; stroke-width: 3; stroke-dasharray: 9 7; }
      .blocking-route { fill: none; stroke: #d96d6d; stroke-width: 3; stroke-dasharray: 9 7; }
      .start { fill: #182432; stroke: #6ea8ff; stroke-width: 2; }
      .anchor { fill: #182432; stroke: #4d9dd8; stroke-width: 2; }
      .hard { fill: #221d13; stroke: #e0b34a; stroke-width: 3; }
      .terminal { fill: #173528; stroke: #3dbe8c; stroke-width: 3; }
      .unknown { fill: #191d24; stroke: #8b97a8; stroke-width: 2; stroke-dasharray: 8 6; }
      .blocking { fill: #241719; stroke: #d96d6d; stroke-width: 2; stroke-dasharray: 8 6; }
      .note { fill: #171b22; stroke: #384350; stroke-width: 2; stroke-dasharray: 9 7; }
      .title { fill: #e8eef6; font: 700 27px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .subtitle { fill: #98a6b8; font: 15px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .tag { fill: #6fb7ef; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .hard-tag { fill: #e0b34a; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .terminal-tag { fill: #54d19b; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .unknown-tag { fill: #a8b4c4; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .blocking-tag { fill: #e08f8f; font: 700 11px "Segoe UI", sans-serif; letter-spacing: .08em; }
      .card-title { fill: #ffffff; font: 700 16px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .text { fill: #d7e2ee; font: 13px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .small { fill: #98a6b8; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .avoid-text { fill: #e3a0a0; font: 600 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .note-tag { fill: #a8b4c4; font: 700 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .note-title { fill: #d7e2ee; font: 700 13px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .legend { fill: #7d8b9c; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d9dd8" />
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b97a8" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d96d6d" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" rx="22" />
  <rect class="panel" x="30" y="28" width="1220" height="580" rx="22" />
  <text class="title" x="62" y="74">意图锚点图 · 测试登录功能</text>
  <text class="subtitle" x="62" y="103">主线只说你想要什么、你会看到什么；实现细节和可查未知分开摆放。</text>

  <path class="main-route" d="M205 235 L245 235" />
  <path class="main-route" d="M395 235 L435 235" />
  <path class="main-route" d="M585 235 L625 235" />
  <path class="hard-route" d="M775 235 L815 235" marker-end="url(#arrow)" />
  <path class="main-route" d="M1005 235 L1045 235" marker-end="url(#arrow)" />

  <g>
    <rect class="start" x="50" y="180" width="155" height="112" rx="18" />
    <text class="tag" x="70" y="207">START</text>
    <text class="card-title" x="70" y="232">你说了一句</text>
    <text class="small" x="70" y="255">“测试登录功能”</text>
    <text class="small" x="70" y="275">我先补全意图</text>
  </g>

  <g>
    <rect class="anchor" x="245" y="164" width="150" height="144" rx="18" />
    <text class="tag" x="265" y="191">a1 · 你想要</text>
    <text class="card-title" x="265" y="216">知道登录能不能用</text>
    <text class="text" x="265" y="240">不是检查所有账号功能</text>
    <text class="small" x="265" y="262">范围先对齐</text>
    <text class="small" x="265" y="283">看不懂就要重画</text>
  </g>

  <g>
    <rect class="anchor" x="435" y="164" width="150" height="144" rx="18" />
    <text class="tag" x="455" y="191">a2 · 你会看到</text>
    <text class="card-title" x="455" y="216">三种登录结果</text>
    <text class="text" x="455" y="240">输对密码</text>
    <text class="text" x="455" y="260">输错密码</text>
    <text class="text" x="455" y="280">不填就提交</text>
  </g>

  <g>
    <rect class="anchor" x="625" y="164" width="150" height="144" rx="18" />
    <text class="tag" x="645" y="191">a3 · 测试方式</text>
    <text class="card-title" x="645" y="216">像真实用户一样点</text>
    <text class="text" x="645" y="240">打开页面，输入账号密码</text>
    <text class="small" x="645" y="262">只能退而测接口时</text>
    <text class="small" x="645" y="283">要明说原因</text>
  </g>

  <g>
    <rect class="hard" x="815" y="164" width="190" height="144" rx="18" />
    <text class="hard-tag" x="835" y="191">a4 · 必须做到</text>
    <text class="card-title" x="835" y="216">每个场景都有证据</text>
    <text class="text" x="835" y="240">结论只能说通过 / 不通过</text>
    <text class="small" x="835" y="262">没跑成就说没跑成</text>
    <text class="small" x="835" y="283">不许编结果</text>
  </g>

  <g>
    <rect class="terminal" x="1045" y="180" width="155" height="112" rx="18" />
    <text class="terminal-tag" x="1065" y="207">END</text>
    <text class="card-title" x="1065" y="232">你能判断</text>
    <text class="small" x="1065" y="255">这轮测试值不值得信</text>
    <text class="small" x="1065" y="275">不改产品代码</text>
  </g>

  <path class="unknown-route" d="M320 308 C320 350 320 358 320 378" marker-end="url(#gray-arrow)" />
  <g>
    <rect class="unknown" x="60" y="378" width="250" height="126" rx="18" />
    <text class="unknown-tag" x="82" y="405">待确认 · 可先查，不猜</text>
    <text class="card-title" x="82" y="430">要测的登录页面在哪？</text>
    <text class="small" x="82" y="453">我会先在项目里找入口</text>
    <text class="small" x="82" y="474">查不到就回头问你</text>
    <text class="small" x="82" y="494">不会猜一个大概位置</text>
  </g>

  <path class="blocking-route" d="M910 308 C910 350 910 358 910 378" marker-end="url(#red-arrow)" />
  <g>
    <rect class="blocking" x="800" y="378" width="250" height="126" rx="18" />
    <text class="blocking-tag" x="822" y="405">必须问你 · 影响做法</text>
    <text class="card-title" x="822" y="430">发现问题后要修吗？</text>
    <text class="small" x="822" y="453">只报告，还是继续修</text>
    <text class="small" x="822" y="474">这会改变这轮结束点</text>
    <text class="small" x="822" y="494">所以不能由我决定</text>
  </g>

  <g>
    <rect class="blocking" x="1080" y="378" width="150" height="126" rx="18" />
    <text class="blocking-tag" x="1100" y="405">不做</text>
    <text class="avoid-text" x="1100" y="430">顺手修 bug</text>
    <text class="avoid-text" x="1100" y="452">重构登录代码</text>
    <text class="avoid-text" x="1100" y="474">新增测试框架</text>
    <text class="avoid-text" x="1100" y="496">扩大测试范围</text>
  </g>

  <path class="unknown-route" d="M660 235 C700 235 700 378 660 378" marker-end="url(#gray-arrow)" />
  <g>
    <rect class="note" x="380" y="378" width="360" height="126" rx="18" />
    <text class="note-tag" x="402" y="405">锚点粒度</text>
    <text class="text" x="402" y="430">只固定会改变行动、你会在意、能确认的事</text>
    <text class="small" x="402" y="453">太大：不知道该干什么</text>
    <text class="small" x="402" y="474">太小：变成死计划</text>
    <text class="small" x="402" y="494">未知必须显式，不能自动脑补</text>
  </g>

  <g>
    <rect class="note" x="60" y="530" width="1170" height="132" rx="20" />
    <text class="note-tag" x="90" y="560">实现注记 · 给 AI / 维护者看，不给用户判断路线用</text>
    <g>
      <text class="note-title" x="90" y="590">技术定位</text>
      <text class="small" x="90" y="614">先定位登录表单和提交接口</text>
      <text class="small" x="90" y="636">不把范围扩大到账号系统</text>
    </g>
    <g>
      <text class="note-title" x="450" y="590">工具选择</text>
      <text class="small" x="450" y="614">优先用真实浏览器自动化</text>
      <text class="small" x="450" y="636">降级只测接口时必须说明</text>
    </g>
    <g>
      <text class="note-title" x="810" y="590">证据边界</text>
      <text class="small" x="810" y="614">三种场景分别记录工具输出</text>
      <text class="small" x="810" y="636">未验证到的情况要明说</text>
    </g>
  </g>

  <text class="legend" x="62" y="692">图例：蓝 = 你想要 / 你会看到　黄 = 必须做到　绿 = 你能验收　灰虚线 = 可查未知　红虚线 = 必须问 / 不做</text>
  <text class="legend" x="62" y="718">写法：你想要 → 你会看到 → 怎么做 → 必须做到 → 你能判断</text>
</svg>
