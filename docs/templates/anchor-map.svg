<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <style>
      .bg { fill: #0e1218; }
      .panel { fill: #141b24; stroke: #252f3c; }
      .axis { fill: none; stroke: #4d9dd8; stroke-width: 4; stroke-linecap: round; opacity: .85; }
      .avoid-line { fill: none; stroke: #d96d6d; stroke-width: 2; stroke-dasharray: 8 8; opacity: .8; }
      .anchor { fill: #182432; stroke: #4d9dd8; stroke-width: 2; rx: 14; }
      .hard { stroke: #e0b34a; stroke-width: 3; }
      .terminal { fill: #173528; stroke: #3dbe8c; stroke-width: 3; rx: 18; }
      .avoid { fill: #241719; stroke: #d96d6d; stroke-width: 2; stroke-dasharray: 7 7; }
      .text { fill: #e8eef6; font: 600 15px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .small { fill: #8b97a8; font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .label { fill: #4d9dd8; font: 700 11px "Segoe UI", sans-serif; }
      .avoid-text { fill: #e99; font: 600 12px "Microsoft YaHei", "Segoe UI", sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d9dd8" />
    </marker>
    <marker id="avoid-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d96d6d" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="360" rx="18" />
  <rect class="panel" x="30" y="25" width="900" height="270" rx="18" />
  <text class="text" x="55" y="65">ag 意图锚点图</text>
  <text class="small" x="55" y="88">目标：快速同步用户路线，不是计划，不是验收标准。</text>

  <path class="axis" d="M90 190 C230 110 350 110 410 170 C470 230 570 230 640 160 C700 100 750 100 800 150" marker-end="url(#arrow)" />

  <g>
    <rect class="anchor" x="65" y="165" width="135" height="54" rx="14" />
    <text class="label" x="82" y="188">A</text>
    <text class="text" x="82" y="208" font-size="14">先看见症状</text>
  </g>

  <g>
    <rect class="anchor" x="310" y="112" width="150" height="54" rx="14" />
    <text class="label" x="327" y="135">B</text>
    <text class="text" x="327" y="155" font-size="14">门诊判病</text>
  </g>

  <g>
    <rect class="anchor hard" x="540" y="162" width="160" height="54" rx="14" />
    <text class="label" x="557" y="185" style="fill:#e0b34a">C</text>
    <text class="text" x="557" y="205" font-size="14">只开一刀处方</text>
  </g>

  <g>
    <rect class="terminal" x="765" y="135" width="150" height="60" rx="18" />
    <text class="label" x="785" y="160" style="fill:#3dbe8c">终点</text>
    <text class="text" x="785" y="182" font-size="14">治一个病</text>
  </g>

  <g>
    <ellipse class="avoid" cx="800" cy="258" rx="90" ry="30" />
    <text class="avoid-text" x="745" y="254">不做大重构</text>
    <path class="avoid-line" d="M620 216 C670 250 710 258 710 258" marker-end="url(#avoid-arrow)" />
    <text class="small" x="610" y="239">偏离锚点时先说冲突</text>
  </g>

  <g>
    <rect x="65" y="255" width="170" height="28" rx="14" fill="#182432" stroke="#252f3c" />
    <text class="small" x="80" y="274">软锚点：持续靠近</text>
    <rect x="250" y="255" width="170" height="28" rx="14" fill="#182432" stroke="#e0b34a" stroke-width="2" />
    <text class="small" x="265" y="274">硬锚点：必须遵守</text>
  </g>
</svg>
